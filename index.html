<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPs — Sergio Meota</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f0e0c; color: #f5efe6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wrap { max-width: 720px; width: 100%; text-align: center; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  p.sub { opacity: .7; margin-bottom: 28px; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
  a.card { display: block; background: #1c1a17; border: 1px solid #333; border-radius: 12px; padding: 28px 16px; color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
  a.card:hover { transform: translateY(-2px); border-color: #c9a86a; }
  a.card strong { display: block; font-size: 17px; margin-bottom: 8px; }
  a.card span { font-size: 14px; opacity: .65; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Landing Pages</h1>
    <p class="sub">Escolha uma pagina para abrir:</p>
    <div class="grid">
      <a class="card" href="./feridas-emocionais/">
        <strong>Feridas Emocionais</strong>
        <span>/feridas-emocionais/</span>
      </a>
      <a class="card" href="./refem-das-emocoes/">
        <strong>Refem das Emocoes</strong>
        <span>/refem-das-emocoes/</span>
      </a>
      <a class="card" href="./ebook-crianca-interior/">
        <strong>Ebook Crianca Interior</strong>
        <span>/ebook-crianca-interior/</span>
      </a>
    </div>
  </div>
</body>
</html>
